schema = 1
id = "diego-rafa.shared"
version = "1.2.2"
manager_min = "0.4.0"

[capture_shortcut]
key = "SUPER + SHIFT + S"
mode = "fullscreen"
output = "save"

[compatibility]
architectures = ["x86_64"]
hyprland_min = "0.56.2"
hyprland_format = "lua"

[recovery]
epoch = "shared-1"
limitations = "Respaldo y restauración de archivos administrados. Paquetes instalados o retirados no se revierten al restaurar archivos ni al elegir una release anterior. Se retiran solo Cursor, Foot, Moonlight y Signal si están instalados y la resolución no afecta otros paquetes; sus datos personales se conservan. Spotify utiliza una copia privada y conserva generaciones de preparación; no altera /opt/spotify ni perfiles de cuenta. No se abren apps al instalar. Recargas de Hyprland/shell al final; no hay atomicidad global. Plugins externos ejecutan código de usuario sin aislamiento. hyprmoncfg se entrega sin perfiles, sin iniciar ni habilitar su daemon. Sin cambios de hardware, GPU, energía, kernel, inicio o arranque."
reboot = false

[[modules]]
id = "desktop"
version = "1.2.0"
description = "Cristal, bordes rectos, blur, cursor visible y animación vertical"

[[modules]]
id = "menu"
version = "1.2.0"
description = "Games/About y organización común del menú"

[[modules]]
id = "defaults"
version = "1.2.0"
description = "Aplicaciones predeterminadas compartidas"

[[modules]]
id = "bar"
version = "1.2.0"
description = "Barra, música e interfaces contextuales de Diego"

[[modules]]
id = "plugins"
version = "1.2.0"
description = "Solo plugins habilitados; AirPods excluido por Diego"

[[modules]]
id = "gaming"
version = "1.2.0"
description = "Steam, Discord, Minecraft Launcher, Roblox mediante Sober y CurseForge"

[[modules]]
id = "spotify"
version = "1.2.0"
description = "Spicetify, Marketplace, OmarchyGlass y adaptación a ventanas estrechas"

[[modules]]
id = "cleanup"
version = "1.2.0"
description = "Ocultar accesos web y retirada explícita revisable de cuatro programas"

