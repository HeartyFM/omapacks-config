schema = 1
id = "diego-rafa.shared"
version = "1.0.0"
manager_min = "0.2.0"

[compatibility]
architectures = ["x86_64"]
omarchy_min = "4.0.0"
omarchy_max = "4.0.4"
hyprland_min = "0.56.2"
hyprland_max = "0.56.2"
hyprland_format = "lua"

[recovery]
epoch = "shared-1"
limitations = "Respaldo de archivos e include. Hyprland y el menú pueden observar cada escritura; no hay atomicidad global. No se copian ajustes de hardware, preferencias ni datos personales. La recarga y los accesos esenciales se verifican al final."
reboot = false

[[modules]]
id = "desktop"
version = "1.0.0"
description = "Apariencia común derivada de looknfeel.lua de Diego; hereda los defaults instalados de Omarchy"

[[modules]]
id = "menu"
version = "1.0.0"
requires = ["desktop"]
description = "Submenú Compartido con información del equipo y terminal; conserva el resto del menú"

[[files]]
module = "desktop"
source = "config/appearance.lua"
target = ".config/hypr/hyprland.lua"
scope = "user"
kind = "hypr_include"

[[files]]
module = "menu"
source = "config/menu.json"
target = ".config/omarchy/extensions/omarchy-menu.jsonc"
scope = "user"
kind = "omarchy_menu"

[[checks]]
module = "desktop"
kind = "hyprland"
required = true

[[modules]]
id = "defaults"
version = "1.0.0"
description = "Aplicaciones predeterminadas de Diego: Firefox, Kitty, Neovim, Nautilus, imv, Evince, mpv y asociaciones HTML de Zen"

[[files]]
module = "defaults"
source = "config/defaults.json"
target = ".config/mimeapps.list"
scope = "user"
kind = "xdg_defaults"

[[packages]]
module = "defaults"
provider = "arch"
name = "base-devel"
version = "1-2"

[[packages]]
module = "defaults"
provider = "arch"
name = "dbus-glib"
version = "0.114-1"

