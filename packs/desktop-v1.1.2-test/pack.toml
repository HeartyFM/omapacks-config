schema = 1
id = "diego-rafa.shared"
version = "1.1.2"
manager_min = "0.3.3"

[capture_shortcut]
key = "SUPER + SHIFT + S"
mode = "fullscreen"
output = "save"

[compatibility]
architectures = ["x86_64"]
omarchy_min = "4.0.4"
omarchy_max = "4.0.4"
hyprland_min = "0.56.2"
hyprland_max = "0.56.2"
hyprland_format = "lua"

[recovery]
epoch = "shared-1"
limitations = "Respaldo de archivos e include. Hyprland y el menú pueden observar cada escritura; no hay atomicidad global. Solo se comparten las capas elegidas de menú, barra, Hyprland y defaults; otros ajustes permanecen locales. La recarga y los accesos esenciales se verifican al final. OmaSettings ejecuta código externo dentro de Quickshell sin aislamiento; sus datos y cambios posteriores no se revierten al retirar el plugin. El atajo administrado se retira y se vuelve a cargar la configuración previa preservada, sin prometer restaurar bindings efímeros externos."
reboot = false

[[modules]]
id = "desktop"
version = "1.1.0"
description = "Apariencia común derivada de looknfeel.lua de Diego; hereda los defaults instalados de Omarchy"

[[modules]]
id = "menu"
version = "1.1.0"
requires = ["desktop"]
description = "Menú actual de Diego: About, Learn, Games y catálogo nativo; conserva entradas ajenas"

[[files]]
module = "desktop"
source = "config/appearance.lua"
target = ".config/hypr/hyprland.lua"
scope = "user"
kind = "hypr_include"

[[files]]
module = "menu"
source = "config/menu.json"
target = ".config/omarchy/extensions/omarchy-menu.jsonc"
scope = "user"
kind = "omarchy_menu"

[[checks]]
module = "desktop"
kind = "hyprland"
required = true

